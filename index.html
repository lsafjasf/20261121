<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOA 方向监听器 (ACN/SN3D)</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #14171c; color: #dde3ea; margin: 0; padding: 20px; display: flex; justify-content: center; }
  main { display: flex; gap: 24px; flex-wrap: wrap; max-width: 980px; }
  h1 { font-size: 18px; width: 100%; margin: 0 0 4px; }
  .panel { background: #1d222b; border: 1px solid #2c333f; border-radius: 10px; padding: 14px; }
  #compass { display: block; cursor: grab; touch-action: none; border-radius: 8px; background: #10131a; }
  #compass:active { cursor: grabbing; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  label { width: 48px; font-size: 13px; color: #9aa7b8; }
  input[type=range] { flex: 1; }
  .val { width: 64px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  button { background: #2b6cb0; color: #fff; border: 0; border-radius: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  button:hover { background: #3182ce; }
  button.secondary { background: #374151; }
  button:disabled { opacity: .45; cursor: default; }
  .meters { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
  .meter { text-align: center; font-size: 11px; color: #9aa7b8; }
  .bar { height: 90px; background: #10131a; border-radius: 4px; position: relative; overflow: hidden; margin: 4px 0; }
  .bar > i { position: absolute; bottom: 0; left: 0; right: 0; background: #48bb78; display: block; }
  .meter.out .bar > i { background: #63b3ed; }
  .db { font-variant-numeric: tabular-nums; }
  #status { font-size: 13px; min-height: 18px; color: #f6ad55; width: 100%; }
  #selftest { font-size: 12px; color: #68d391; white-space: pre-line; max-height: 150px; overflow: auto; }
  .hint { font-size: 12px; color: #7b8798; }
</style>
</head>
<body>
<main>
  <h1>一阶 Ambisonics 方向监听器 · ACN/SN3D (W Y Z X)</h1>
  <div class="panel">
    <canvas id="compass" width="380" height="380"></canvas>
    <div class="hint">拖动罗盘：水平 = 偏航 yaw，垂直 = 俯仰 pitch。箭头为头部朝向，圆点为声源（世界固定）。</div>
  </div>
  <div class="panel" style="width: 300px">
    <div class="row"><label>yaw</label><input id="yaw" type="range" min="-180" max="180" step="0.1" value="0"><span class="val" id="yawVal">0.0°</span></div>
    <div class="row"><label>pitch</label><input id="pitch" type="range" min="-90" max="90" step="0.1" value="0"><span class="val" id="pitchVal">0.0°</span></div>
    <div class="row"><label>roll</label><input id="roll" type="range" min="-180" max="180" step="0.1" value="0"><span class="val" id="rollVal">0.0°</span></div>
    <div class="row"><button id="reset" class="secondary">方位归零</button><span class="hint">yaw&gt;0 左转, pitch&gt;0 抬头</span></div>
    <hr style="border-color:#2c333f">
    <div class="row"><button id="srcFront">测试源·前</button><button id="srcSide">测试源·侧(左)</button><button id="srcTop">测试源·上</button></div>
    <div class="row"><button id="srcStop" class="secondary">停止声源</button><label style="width:auto">或载入 4 声道 WAV:</label><input id="file" type="file" accept="audio/*" style="font-size:12px;width:150px"></div>
    <div class="row"><button id="orbit">环绕一圈验证</button><span class="hint" id="orbitInfo">用正前恒定参考源 yaw 0→360°，对比首尾输出</span></div>
    <div class="meters" id="meters"></div>
  </div>
  <div id="status">点击任意按钮以启动音频。</div>
  <div class="panel" style="width:100%"><b style="font-size:13px">数学自检（与 node test.mjs 相同）</b><div id="selftest">…</div></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
