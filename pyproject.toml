[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freeze-diagnostics"
version = "0.1.0"
description = "Fixed-camera freeze diagnostics using OpenCV and decoder PTS"
requires-python = ">=3.11"
dependencies = [
  "av>=16.0",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
]

[project.scripts]
freeze-diag = "freeze_diag.cli:main"

[tool.setuptools.packages.find]
include = ["freeze_diag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
