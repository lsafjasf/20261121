[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "film-stabilizer"
version = "0.1.0"
description = "Perforation-based stabilizer for frame-by-frame scanned 16 mm film"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
]

[project.scripts]
film-stabilize = "film_stabilizer.cli:main"
film-demo = "film_stabilizer.demo:main"

[tool.setuptools.packages.find]
include = ["film_stabilizer*"]
