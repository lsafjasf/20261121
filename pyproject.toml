[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oscilloscope-trace-video"
version = "1.0.0"
description = "CFR oscilloscope trace videos from unevenly timed samples"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
scope-video = "oscilloscope_video.cli:main"

[tool.setuptools]
packages = ["oscilloscope_video"]
