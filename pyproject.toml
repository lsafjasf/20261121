[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roomtone-handoff"
version = "0.1.0"
description = "Deterministic per-channel room-tone replacement for WAV handoff"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
roomtone-handoff = "roomtone_handoff.cli:main"

[tool.setuptools.packages.find]
include = ["roomtone_handoff*"]

