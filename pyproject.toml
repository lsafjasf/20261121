[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-resync"
version = "0.1.0"
description = "Resynchronize digital-piano MIDI notes and pedal intervals to an audio timeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
piano-resync = "piano_resync.cli:main"

[tool.setuptools.packages.find]
include = ["piano_resync*"]

