[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miccal"
version = "0.1.0"
description = "Four-microphone swept-sine calibration and layout audit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
miccal = "miccal.cli:main"

[tool.setuptools.packages.find]
include = ["miccal*"]
