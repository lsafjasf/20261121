[package]
name = "flac-trim"
version = "0.1.0"
edition = "2024"
description = "Sample-accurate FLAC trimming with frame reuse"
license = "MIT"

[lib]
name = "flac_trim"
path = "src/lib.rs"

[[bin]]
name = "flac-trim"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
claxon = "0.4"
md-5 = "0.10"
